  /v1/public/{public_slug}/changelog:
    get:
      tags:
        - FeatureRequests
      summary: List shipped feature requests (changelog feed)
      description: Returns the same `FeatureRequest` shape as the public list, filtered to
        `state.category=done` AND `shipped_at IS NOT NULL`, sorted by `shipped_at DESC, id DESC`.
        The `since` query param clips to `shipped_at > since` for cheap "what shipped this week"
        queries.
      parameters:
        - in: path
          name: public_slug
          schema:
            type: string
          required: true
        - in: query
          name: since
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        - in: query
          name: page_size
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: page_token
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: A page of shipped feature requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureRequestListEnvelope"
        "404":
          description: Slug unknown, project private, or `changelog` not in `enabled_surfaces`.
