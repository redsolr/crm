          description: "Prefixed resource ID. Wire form: `att_<base58>`."
          example: att_3wVELpcuMmQzwJYr5JBWv5
        parent_type:
          type: string
          enum:
            - work_item
            - comment
            - communication
        parent_id:
          type: string
          description: Polymorphic on `parent_type`. `wi_*` when `work_item`; `cmt_*` when `comment`; `comm_*`
            when `communication`.
        s3_key:
          type: string
        file_name:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        sha256:
          anyOf:
            - type: string
            - type: "null"
        uploaded_by_id:
          type: string
          description: Opaque polymorphic actor reference (Actor Contract — 1-128 chars,
