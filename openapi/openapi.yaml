openapi: 3.1.0
info:
  title: Jurisimus Platform API
  version: 1.0.0
  description: Knowledge infrastructure for software teams. Public surface — canonical platform
    primitives (WorkItem, Iteration, Page, Label, Project, Workflow). Auto-generated from Zod
    schemas via `bun run openapi:build`. Do not hand-edit; CI rejects PRs whose Zod schemas drift
    from this file.
servers:
  - url: https://api.jurisimus.com
security:
  - bearerAuth: []
paths:
  /v1/accounts:
    get:
      tags:
        - Accounts
      summary: List accounts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort_by
          schema:
            type: string
        - in: query
          name: sort_order
          schema:
            type: string
            enum:
              - asc
              - desc
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListEnvelope"
    post:
      tags:
        - Accounts
      summary: Create an account
      parameters:
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccount"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /v1/accounts/me/organizations:
    get:
      tags:
        - Accounts
      summary: List the caller's organization memberships (JWT-only)
      description: "Returns every organization the authenticated account is an active member of, paired
        with the membership row (role, joined_at). Bare `{ data: [...] }` envelope — no cursor
        metadata since membership counts are typically single-digit. **Tenant-owner-only**:
        dashboard JWT session only; API keys and PATs are rejected with 403."
      responses:
        "200":
          description: List of memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMembershipList"
  /v1/accounts/me/workspaces:
    get:
      tags:
        - Accounts
      summary: List every workspace the caller can reach (workspace-switcher source, JWT-only)
      description: Returns every workspace across every organization the authenticated account is a member
        of, grouped `organization → workspace`. Soft-deleted orgs and workspaces are filtered out
        server-side. Sort order is deterministic `(org.created_at, workspace.created_at)`. Companion
        to the `Jurisimus-Workspace-Id` request header — see `docs/platform/api-discipline.md` §
        Workspace switcher.
      responses:
        "200":
          description: Grouped workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWorkspaces"
  /v1/accounts/me:
    delete:
      tags:
        - Accounts
      summary: Delete the caller's whole account (JWT-only)
      description: 'Cascades through every organization the caller owns: cancels subscriptions, emits
        `organization.deleted` events, deletes each org row (FK cascade handles every child
        resource), revokes all account tokens, and deletes the account row. Required by Apple App
        Store + GDPR. Body MUST contain `{ "confirmation": "DELETE" }` or the request is rejected.
        **Tenant-owner-only**: dashboard JWT session only; API keys and PATs are rejected with 403
        (an integration credential cannot delete its own account).'
      parameters:
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMyAccountRequest"
      responses:
        "200":
          description: Account deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedAck"
  /v1/accounts/me/usage/summary:
    get:
      tags:
        - Accounts
      summary: Consolidated usage across all owned organizations (JWT-only)
      description: Sums `usage_summary` results for every organization the caller's account owns (via
        `organizations.account_id`). Returns the grand total alongside a per-org breakdown so a
        multi-org payer can reconcile total spend without round-tripping per org. Each org's period
        is its own subscription window — orgs on different plans bill on different cycles.
      responses:
        "200":
          description: Consolidated usage across the caller's owned organizations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUsageSummary"
  /v1/accounts/me:switch_organization:
    post:
      tags:
        - Accounts
      summary: Switch the caller's active organization (JWT-only)
      description: AIP-136 custom action. Re-issues the caller's access/refresh token pair bound to the
        specified organization. The active organization is JWT-bound (see `multi-tenant-model.md` §
        "Active organization resolution"); switching is a token rebind, not a header override.
        Returns 403 `organization_membership_required` if the caller doesn't hold an active
        membership in the target org.
      parameters:
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganization"
      responses:
        "200":
          description: New token pair bound to the target organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthExchange"
        "403":
          description: Caller is not an active member of the target organization.
  /v1/accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Retrieve an account
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
            example: wi_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
            stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md` §
            A1."
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404": &a1
          description: Not found.
    put:
      tags:
        - Accounts
      summary: Update an account
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
            example: wi_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
            stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md` §
            A1."
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccount"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      tags:
        - Accounts
      summary: Delete an account
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
            example: wi_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
            stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md` §
            A1."
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedAck"
  /v1/activities:
    get:
      tags:
        - Activities
      summary: List activities (sidebar feed)
      description: Page-paginated activity list, org-scoped. Powers the sidebar feed. Agent-facing
        consumers should prefer `GET /v1/activity` (cursor-paginated, narrower projection).
      parameters:
        - in: query
          name: workspace_id
          schema:
            type: string
            pattern: ^ws_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `ws_<base58>`."
            example: ws_3wVELpcuMmQzwJYr5JBWv5
        - in: query
          name: entity_id
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - in: query
          name: entity_type
          schema:
            type: string
            enum:
              - task
              - epic
              - sprint
              - iteration
              - project
              - comment
              - page
              - label
              - attribute_value
              - attachment
              - site
              - feature_request_board
        - in: query
          name: type
          schema:
            type: string
            enum:
              - task_created
              - task_updated
              - task_deleted
              - task_moved
              - task_assigned
              - task_unassigned
              - task_status_changed
              - task_priority_changed
              - task_sprint_changed
              - task_epic_changed
              - task_estimate_changed
              - task_due_date_changed
              - comment_added
              - comment_updated
              - comment_deleted
              - iteration_created
              - iteration_updated
              - iteration_started
              - iteration_completed
              - iteration_deleted
              - label_attached
              - label_detached
              - attribute_value_changed
              - attribute_value_unset
              - attachment_uploaded
              - attachment_deleted
              - tag_added
              - tag_removed
              - page_created
              - page_updated
              - page_deleted
              - page_collab_joined
              - page_collab_left
              - site_created
              - site_enabled
              - site_disabled
              - site_updated
              - site_deleted
              - feature_request_board_created
              - feature_request_board_updated
              - feature_request_board_deleted
        - in: query
          name: actor_id
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
      responses:
        "200":
          description: A page of activities + total count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityListEnvelope"
  /v1/activities/workspace:
    get:
      tags:
        - Activities
      summary: List activities for the caller’s workspace
      description: Returns the workspace-scoped activity feed. The workspace is resolved from the caller
        credential (API key) or the `Jurisimus-Workspace-Id` override (JWT / PAT).
      parameters:
        - in: query
          name: limit
          schema:
            description: Max rows to return. Defaults to 50 server-side.
            type: integer
            minimum: 1
            maximum: 9007199254740991
          description: Max rows to return. Defaults to 50 server-side.
      responses:
        "200":
          description: Activities for the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeedEnvelope"
  /v1/activities/entity/{entityType}/{entityId}:
    get:
      tags:
        - Activities
      summary: List activities for a specific entity
      parameters:
        - in: path
          name: entityType
          schema:
            type: string
            enum:
              - task
              - epic
              - sprint
              - iteration
              - project
              - comment
              - page
              - label
              - attribute_value
              - attachment
            description: Closed set mirrored from `ENTITY_TYPES` in activities.dto.ts.
          required: true
          description: Closed set mirrored from `ENTITY_TYPES` in activities.dto.ts.
        - in: path
          name: entityId
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          required: true
        - in: query
          name: limit
          schema:
            description: Max rows to return. Defaults to 50 server-side.
            type: integer
            minimum: 1
            maximum: 9007199254740991
          description: Max rows to return. Defaults to 50 server-side.
      responses:
        "200":
          description: Activities scoped to the (entityType, entityId) pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeedEnvelope"
  /v1/activities/me:
    get:
      tags:
        - Activities
      summary: List activities the caller authored
      parameters:
        - in: query
          name: limit
          schema:
            description: Max rows to return. Defaults to 50 server-side.
            type: integer
            minimum: 1
            maximum: 9007199254740991
          description: Max rows to return. Defaults to 50 server-side.
      responses:
        "200":
          description: Activities authored by the authenticated caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeedEnvelope"
  /v1/activity:
    get:
      tags:
        - ActivityFeed
      summary: Query the org activity feed
      description: Cursor-paginated, org-scoped, simple-equality filters. The canonical "what happened in
        this org in the last N hours?" endpoint for AI agents — kept narrow so a page drops cleanly
        into a model prompt. See `docs/ai-native-company/README.md` § 5.
      parameters:
        - in: query
          name: page_size
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: page_token
          schema:
            type: string
            minLength: 1
        - in: query
          name: entity_type
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - in: query
          name: entity_id
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        - in: query
          name: actor_type
          schema:
            type: string
            enum:
              - user
              - agent
              - system
              - service
        - in: query
          name: type
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - in: query
          name: workspace_id
          schema:
            type: string
            pattern: ^ws_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `ws_<base58>`."
            example: ws_3wVELpcuMmQzwJYr5JBWv5
        - in: query
          name: since
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        - in: query
          name: until
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        - in: query
          name: include
          schema:
            description: "Comma-separated relations to inline-expand. Whitelist: `actor_account`, `entity`. See
              `docs/platform/api-discipline.md` § C2."
            type: string
          description: "Comma-separated relations to inline-expand. Whitelist: `actor_account`, `entity`. See
            `docs/platform/api-discipline.md` § C2."
      responses:
        "200":
          description: A cursor page of activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCursorPage"
  /v1/api_keys:
    get:
      tags:
        - ApiKeys
      summary: List API keys
      description: Lists every API key in the caller’s active organization. The raw token value is NEVER
        carried on this response — consumers identify rows via `token_prefix` + `token_last4`.
      responses:
        "200":
          description: A list of API-key rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
    post:
      tags:
        - ApiKeys
      summary: Issue a new API key
      description: Mints a fresh `ak_live_*` (or `ak_test_*`) token and returns it ONCE on this response
        under `token`. Subsequent reads omit the field (the value is hashed at rest). Store the
        token immediately — the platform cannot recover it.
      parameters:
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
      responses:
        "201":
          description: Created. `token` is populated for this single response only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "403":
          description: API keys cannot mint other API keys — sign in with a user session.
  /v1/api_keys/{id}:
    get:
      tags:
        - ApiKeys
      summary: Retrieve an API key
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
            example: wi_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
            stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md` §
            A1."
      responses:
        "200":
          description: Found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
    delete:
      tags:
        - ApiKeys
      summary: Revoke an API key
      description: Marks the row revoked and pushes its id onto the platform-wide denylist for
        zero-latency revocation across replicas.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
            example: wi_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
            stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md` §
            A1."
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
  /v1/api_keys/{id}/usage:
    get:
      tags:
        - ApiKeys
      summary: Per-key usage drill-down
      description: Last-30-days totals + daily time-series for one specific api-key. Mirrors the org-level
        `usage/breakdown?group_by=day` shape filtered to a single `api_key_id`. Default window is
        the last 30 days ending now; pass `from` / `to` (RFC 3339) to override.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
            example: wi_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
            stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md` §
            A1."
        - in: query
          name: from
          schema:
            type: string
            format: date-time
