          pattern: ^org_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `org_<base58>`."
          example: org_3wVELpcuMmQzwJYr5JBWv5
        name:
          type: string
        token_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        total_cost_cents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        period_start:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
        period_end:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
      required:
        - organization_id
        - name
        - token_count
        - total_cost_cents
        - period_start
        - period_end
      additionalProperties: false
      description: Per-organization spend row in the Account-level consolidated usage view. Each row
        carries the org’s own period window — orgs on different plans bill on different cycles.
    AuthExchange:
      type: object
      properties:
        success:
          type: boolean
          const: true
        user:
          type: object
          properties:
            id:
              type: string
              pattern: ^acc_[1-9A-HJ-NP-Za-km-z]+$
              description: "Prefixed resource ID. Wire form: `acc_<base58>`."
              example: acc_3wVELpcuMmQzwJYr5JBWv5
            email:
              type: string
              format: email
              pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            full_name:
              anyOf:
                - type: string
                - type: "null"
            avatar_url:
              anyOf:
                - type: string
                - type: "null"
          required:
            - id
            - email
            - full_name
            - avatar_url
          additionalProperties: false
        organization_id:
          type: string
          pattern: ^org_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `org_<base58>`."
          example: org_3wVELpcuMmQzwJYr5JBWv5
        organization_name:
          type: string
        role:
          type: string
        needs_onboarding:
          type: boolean
        needs_profile_setup:
          type: boolean
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - success
        - user
        - needs_onboarding
        - needs_profile_setup
        - access_token
        - refresh_token
        - expires_in
      additionalProperties: false
      description: Token-exchange response — same envelope returned by `POST /auth/workos/exchange` and
        `POST /v1/accounts/me:switch_organization`.
    ActivityListEnvelope:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        total:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - activities
        - total
      additionalProperties: false
    Activity:
      type: object
      properties:
        id:
          type: string
          pattern: ^act_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `act_<base58>`."
          example: act_3wVELpcuMmQzwJYr5JBWv5
        type:
          type: string
          description: Activity type (e.g. `task_created`, `comment_added`). Open string on the wire so
            writers can introduce new types without a parallel reader deploy. Closed set lives in
            `activities.dto.ts` ACTIVITY_TYPES for runtime validation.
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        entity_identifier:
          anyOf:
            - type: string
            - type: "null"
        workspace_id:
          anyOf:
            - type: string
              pattern: ^ws_[1-9A-HJ-NP-Za-km-z]+$
              description: "Prefixed resource ID. Wire form: `ws_<base58>`."
              example: ws_3wVELpcuMmQzwJYr5JBWv5
            - type: "null"
        actor_id:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: "null"
        actor_type:
          $ref: "#/components/schemas/ActivityActorType"
        actor_name:
          anyOf:
            - type: string
            - type: "null"
        changes:
          description: Free-form diff payload — keys depend on `type`. Treat as opaque JSON unless your reader
            has a per-type schema.
        metadata:
          description: Free-form per-event metadata. Same opacity rules as `changes`.
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        actor_account:
          $ref: "#/components/schemas/ActivityActorPayload"
        entity:
          $ref: "#/components/schemas/ActivityEntityPayload"
      required:
        - id
        - type
        - entity_type
        - entity_id
        - entity_identifier
        - workspace_id
        - actor_id
        - actor_type
        - actor_name
        - changes
        - metadata
        - created_at
      additionalProperties: false
      description: Customer-facing projection of an `service.activities` row. Excludes `organization_id`,
        `row_hash`, `prev_hash`, `token_scope_at_call` (internal bookkeeping). The activity feed is
        the "queryable company" primitive — kept narrow so an agent can drop a page directly into a
        model prompt without burning the context window.
    ActivityActorType:
      type: string
      enum:
        - user
        - agent
        - system
        - service
      description: Closed set mirrored from the `actor_type` pgEnum on `service.activities`. `agent`
        covers AI agents calling the API on behalf of a user; `system` and `service` are platform
        writers.
    ActivityActorPayload:
      type: object
      properties:
        id:
          anyOf:
            - type: string
              pattern: ^acc_[1-9A-HJ-NP-Za-km-z]+$
              description: "Prefixed resource ID. Wire form: `acc_<base58>`."
              example: acc_3wVELpcuMmQzwJYr5JBWv5
            - type: "null"
        type:
          $ref: "#/components/schemas/ActivityActorType"
        name:
          anyOf:
            - type: string
            - type: "null"
        email:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - type
        - name
        - email
      additionalProperties: false
      description: Inline expansion of an activity's actor account. Surfaced under `actor_account` when
        the caller passes `?include[0]=actor_account`. Minimal projection — only the fields a triage
        UI needs.
    ActivityEntityPayload:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        type:
          type: string
          description: Resolved entity type (e.g. `work_item`). NOT necessarily the same as the activity's
            `entity_type` — for `entity_type=task` the resolved entity is a `work_item`.
        identifier:
          anyOf:
            - type: string
            - type: "null"
        title:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - type
        - identifier
        - title
      additionalProperties: false
      description: Inline expansion of an activity's entity. Today only `entity_type=task` resolves (the
        dominant agent surface). Other entity types fall back to the flat `entity_id` /
        `entity_identifier` fields on the base shape.
    ActivityFeedEnvelope:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
      required:
        - activities
      additionalProperties: false
    ActivityCursorPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        has_more:
          type: boolean
        next_page_url:
          anyOf:
            - type: string
            - type: "null"
          description: Stripe v2 URL-form forward page token. Relative URL of shape
            `<path>?page_token=<encoded>`. Fetch via `new URL(next_page_url, currentRequestUrl)`.
            `null` when `has_more === false`.
        previous_page_url:
          anyOf:
            - type: string
            - type: "null"
          description: Stripe v2 URL-form backward page token. Relative URL of shape
            `<path>?page_token=<encoded>`. `null` on the first page; non-null on every subsequent
            page.
      required:
        - data
        - has_more
        - next_page_url
        - previous_page_url
      additionalProperties: false
    ApiKeyList:
