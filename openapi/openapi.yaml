    post:
      tags:
        - Credentials
      summary: Attach a new LLM credential
      description: Verifies the supplied key with a pre-flight probe and stores it encrypted in the vault.
        The raw key is consumed once and never echoed back — only the projected row + test outcome.
      parameters:
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
