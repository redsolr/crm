          items:
            $ref: "#/components/schemas/RollingWindow"
          description: Rolling-window meters (session 5hr / weekly 7d). Empty array when no window caps are
            configured for this environment.
        projected_exhaustion_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
          description: "Burn-rate projection: at the trailing-24h spend pace, when the monthly budget runs
            out. `null` when it carries no signal (nothing spent recently, no budget to exhaust,
            already over budget, or the period resets first). A pacing hint — never an enforcement
            input."
        usage:
          $ref: "#/components/schemas/UsageSummaryUsage"
        by_api_key:
          type: array
          items:
            $ref: "#/components/schemas/UsageByApiKey"
          description: Per-api-key spend breakdown for the same period covered by `usage`. Sums across all
            entries equal `usage.total_cost_cents` and `usage.token_count`. Empty array when no
            spend yet.
      required:
        - organization_id
        - budget
        - windows
        - projected_exhaustion_at
        - usage
        - by_api_key
      additionalProperties: false
      description: Composite "current period at a glance" payload. Combines the budget cap snapshot with
        the realised spend / token count + a per-api-key breakdown for cost attribution.
    Budget:
      type: object
      properties:
        total_cost_cents:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Spend across the current billing period, in cents (USD).
        budget_cents:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Configured per-period budget cap, in cents (USD). 0 when the plan has no enforced cap.
        budget_remaining_cents:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: "`budget_cents - total_cost_cents`, in cents (USD). MAY be negative when the org has
            overrun a soft cap."
        percent_used:
          type: number
          description: Integer percentage of `budget_cents` consumed, in [0, 100] (capped at 100). Render
            directly — do NOT multiply by 100. (Description corrected 2026-06-13; the wire value was
            always 0-100.)
        within_budget:
          type: boolean
        plan_type:
          anyOf:
            - type: string
            - type: "null"
          description: The active plan key (`free` / `starter` / `plus` / `pro` / `max`). `null` when no
            subscription resolves.
        period_start:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
        period_end:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
      required:
        - total_cost_cents
        - budget_cents
        - budget_remaining_cents
        - percent_used
        - within_budget
        - plan_type
        - period_start
        - period_end
      additionalProperties: false
      description: Snapshot of the organization's billing-period spend vs. its configured budget cap.
        Money in integer cents to match the platform-wide `*_cents` discipline.
    RollingWindow:
      type: object
      properties:
        key:
          type: string
          enum:
            - session
            - weekly
          description: Stable window key. `session` = rolling 5 hours, `weekly` = rolling 7 days.
        label:
          type: string
          description: Human label for panels (e.g. "Session (5hr)").
        hours:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Window length in hours (rolling, anchored to now).
        spent_cents:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: USD spend inside the window, in cents.
        cap_cents:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Hard cap for the window, in cents — a fraction of the plan's monthly budget (caps scale
            with tier). 0 = the window never binds (free plan).
        percent_used:
          type: number
          description: Integer percentage of `cap_cents` consumed, in [0, 100] (capped at 100). Render
            directly — do NOT multiply by 100.
        within_cap:
          type: boolean
          description: False when the window is exhausted — LLM-spending requests return 429
            `usage_limit_exceeded` with `meta.limitType` set to this window key until usage ages out
            or the plan is upgraded. Top-up credit does NOT bypass window caps (period cap only).
        resets_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
          description: When the OLDEST in-window spend ages out — rolling windows free up gradually, so this
            is the earliest moment the meter drops, not a full reset. `null` when the window has no
            spend.
      required:
        - key
        - label
        - hours
        - spent_cents
        - cap_cents
        - percent_used
        - within_cap
        - resets_at
      additionalProperties: false
      description: One rolling-window usage meter (session 5hr / weekly 7d). Hard throughput caps that
        smooth the monthly budget across time.
    UsageSummaryUsage:
      type: object
      properties:
        token_count:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Sum of input + output tokens consumed in the current period. RAW token count — NOT
            cents, NOT dollars.
        total_cost_cents:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: USD spend in the current period, in cents.
      required:
        - token_count
        - total_cost_cents
      additionalProperties: false
    UsageByApiKey:
      type: object
      properties:
        api_key_id:
          anyOf:
            - type: string
            - type: "null"
          description: Prefixed `ak_*` id of the api-key that drove the spend, or `null` for the lump row
            aggregating non-api-key writes (JWT / PAT / agent / cron).
        name:
          anyOf:
            - type: string
            - type: "null"
          description: Operator-supplied display name for the key. `null` for the lump row.
        last4:
          anyOf:
            - type: string
            - type: "null"
          description: Last 4 chars of the original raw token — for "delete the one ending xy12?"
            disambiguation in dashboards. `null` for the lump row.
        token_count:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Sum of tokens charged to this key in the period.
        total_cost_cents:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: USD spend attributed to this key in the period, in cents.
      required:
        - api_key_id
        - name
        - last4
        - token_count
        - total_cost_cents
      additionalProperties: false
      description: Per-key billing attribution row. Sorted by `total_cost_cents` descending so the
        heaviest spender is at index 0. The `null` lump row (when present) appears last.
    UsageBreakdown:
      type: object
      properties:
        organization_id:
          type: string
          pattern: ^org_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `org_<base58>`."
          example: org_3wVELpcuMmQzwJYr5JBWv5
        group_by:
          type: string
          enum:
            - workspace
            - model
            - day
            - api_key
            - member
            - operation_type
        period_start:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        period_end:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        data:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/UsageByWorkspace"
            - type: array
              items:
                $ref: "#/components/schemas/UsageByModel"
            - type: array
              items:
                $ref: "#/components/schemas/UsageByDay"
            - type: array
              items:
                $ref: "#/components/schemas/UsageByApiKey"
            - type: array
              items:
                $ref: "#/components/schemas/UsageByMember"
            - type: array
              items:
                $ref: "#/components/schemas/UsageByOperationType"
      required:
