  /v1/pending_actions/{id}/approve:
    post:
      tags:
        - PendingActions
      summary: Approve a pending action and execute its handler
      description: Flips the row to `approved`, stamps `decided_by_account_id` + `decided_at` with the
        deciding user, and dispatches the registered `PendingActionHandler` for the action type
        INSIDE the same transaction. If the handler throws, the transaction rolls back including the
        approve mark — retries see the row still pending. The handler runs in the deciding user’s
        authenticated context, NOT the agent token that proposed; this is the OWASP LLM06
        mitigation. Returns the post-approval row plus the handler’s opaque `result`.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^pact_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `pact_<base58>`."
            example: pact_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `pact_<base58>`."
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      responses:
        "200":
          description: Approved + executed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAgentActionApprovedEnvelope"
        "404": *a1
        "409":
          description: Row is no longer in `pending` state (already approved / rejected / expired) — see
            error.code `resource_conflict`.
        "501":
          description: No `PendingActionHandler` is registered for the action type — see error.code
            `pending_action_handler_unregistered`. Server-side wiring gap; retry once the owning
            module ships a handler. Rejecting the action manually is safe.
  /v1/pending_actions/{id}/reject:
    post:
      tags:
        - PendingActions
      summary: Reject a pending action with an optional reason
      description: Flips the row to `rejected` with the supplied reason. No execution path — rejected
        proposals leave no domain side effect, only the audit row capturing the human decision and
        the agent’s next-iteration learning signal.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^pact_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `pact_<base58>`."
            example: pact_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `pact_<base58>`."
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPendingAction"
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAgentActionRejectedEnvelope"
        "404": *a1
        "409":
          description: Row is no longer in `pending` state — see error.code `resource_conflict`.
