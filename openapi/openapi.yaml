            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatResponse"
      responses:
        "200":
          description: "Server-Sent Events stream — emits a leading `chat_response` event carrying `{ chat_id,
            chat_response_id }`, then Anthropic-style typed events: `message_start`,
            `content_block_start`, `content_block_delta`, `content_block_stop`, `message_delta`,
            `message_stop`. On failure, an `error` event is emitted with the platform error taxonomy
            code. Reconnecting clients can fetch the persisted result via `GET
            /v1/chats/{id}/responses/{response_id}`."
          content:
            text/event-stream:
              schema:
                type: string
        "201":
          description: Completed response (non-streaming).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "402":
          description: BYOK credential required.
        "409":
          description: Idempotency-Key already in flight or reused with a different body.
        "429":
          description: Rate limit / usage cap exceeded.
