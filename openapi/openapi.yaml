          description: "Prefixed resource ID. Wire form: `wit_<base58>`."
          example: wit_3wVELpcuMmQzwJYr5JBWv5
        key:
          type: string
        name:
          type: string
      required:
        - id
        - key
        - name
      additionalProperties: false
      description: Inline work-item-type projection. Surfaced by `key` so vertical templates (Bug / Case /
        Matter) are first-class on the wire.
    WorkItemPriority:
      type: string
      enum:
        - none
        - low
        - medium
        - high
        - urgent
    Visibility:
      type: string
      enum:
        - private
        - internal
        - public
    WorkItemEnvelope:
      type: object
      properties:
        work_item:
          $ref: "#/components/schemas/WorkItem"
      required:
        - work_item
      additionalProperties: false
      description: Single-row envelope. The `work_item` key is snake_case in line with the platform-wide
        field-naming convention (Stripe v2 style; see `docs/platform/api-discipline.md` § "Field
        naming").
    WorkItemBulkResponse:
      type: object
      properties:
        work_items:
          type: array
          items:
            $ref: "#/components/schemas/WorkItem"
      required:
        - work_items
      additionalProperties: false
      description: Bulk-update envelope. The `work_items` key is snake_case in line with the platform-wide
        field-naming convention.
    WorkflowListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
      required:
        - data
      additionalProperties: false
    Workflow:
      type: object
      properties:
        id:
          type: string
          pattern: ^wf_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `wf_<base58>`."
          example: wf_3wVELpcuMmQzwJYr5JBWv5
        workspace_id:
          type: string
          pattern: ^ws_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `ws_<base58>`."
          example: ws_3wVELpcuMmQzwJYr5JBWv5
        name:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - workspace_id
        - name
        - is_default
        - created_at
        - updated_at
      additionalProperties: false
      description: A state machine scoped to a workspace. Owns an ordered set of `WorkflowState`s;
        consumed by `WorkItemType` (default workflow per type) and `WorkItem` (current state).
    WorkflowWithStates:
      type: object
      properties:
        workflow:
          $ref: "#/components/schemas/Workflow"
        states:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowState"
      required:
        - workflow
        - states
      additionalProperties: false
      description: A workflow plus its ordered states. Returned on single-workflow GET / POST so the SDK
        can render the state machine without a second round-trip.
    WorkflowState:
      type: object
      properties:
        id:
          type: string
          pattern: ^wfs_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `wfs_<base58>`."
          example: wfs_3wVELpcuMmQzwJYr5JBWv5
        workflow_id:
          type: string
          pattern: ^wf_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `wf_<base58>`."
          example: wf_3wVELpcuMmQzwJYr5JBWv5
        key:
          type: string
          description: Stable slug (lowercase, digits, underscores, 1–40 chars). Rename-safe — clients
            identify states by `key` even though internal joins go through `id`.
        name:
          type: string
        category:
          $ref: "#/components/schemas/WorkflowStateCategory"
        position:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - workflow_id
        - key
        - name
        - category
        - position
        - created_at
        - updated_at
      additionalProperties: false
      description: One node in a workflow's state machine. `category` is a platform-wide semantic bucket
        (not_started / active / done / dead) so downstream primitives reason about progress without
        knowing tenant-specific `key` or `name`.
    WorkflowEnvelope:
      type: object
      properties:
        workflow:
          $ref: "#/components/schemas/Workflow"
      required:
        - workflow
      additionalProperties: false
    WorkflowStateListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowState"
      required:
        - data
      additionalProperties: false
    WorkflowStateEnvelope:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/WorkflowState"
      required:
        - state
      additionalProperties: false
    WorkspaceListResponse:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
      required:
        - workspaces
      additionalProperties: false
    Workspace:
      type: object
      properties:
        id:
          type: string
          pattern: ^ws_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `ws_<base58>`."
          example: ws_3wVELpcuMmQzwJYr5JBWv5
        organization_id:
          type: string
          pattern: ^org_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `org_<base58>`."
          example: org_3wVELpcuMmQzwJYr5JBWv5
        name:
          type: string
        key:
          type: string
          description: Short uppercase identifier code (2-10 chars, A-Z/0-9, starts with a letter). Used as
            the prefix for work-item identifiers (e.g. `SALES-42`). Customer-editable; unique within
            the organization (soft-delete aware).
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        module_keys:
          type: array
          items:
            type: string
          description: Platform-owned module discriminators (`sales`, `legal`, …) stamped by
            workspace-template application. Read-only over the wire; consumers derive an
            organization’s enabled module surfaces from the union across its workspaces.
        expires_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
          description: Ephemeral workspaces (PR previews) set this; null for long-lived workspaces.
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updated_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - organization_id
        - name
        - key
        - metadata
        - module_keys
        - expires_at
        - created_at
        - updated_at
      additionalProperties: false
      description: Customer-facing projection of a `control.workspaces` row. Workspace is the SOLE
        data-isolation boundary — RLS on every `app.*` table gates on `(organization_id,
        workspace_id)`. Uniform isolated universe; no mode / livemode / sandbox / prod
        discriminator.
    PlatformEventRelatedObjectOutput:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        url:
          type: string
          description: Relative URL — resolve against the API base and GET it for the resource's current state.
      required:
        - id
        - type
        - url
      additionalProperties: false
    PlatformEvent:
      type: object
      properties:
        id:
          type: string
          pattern: ^evt_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `evt_<base58>`."
          example: evt_3wVELpcuMmQzwJYr5JBWv5
        object:
          type: string
          const: v2.platform.event
        type:
          type: string
          description: Event-type literal (`work_item.created`, `iteration.started`, …).
        created:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        organization_id:
          type: string
          pattern: ^org_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `org_<base58>`."
          example: org_3wVELpcuMmQzwJYr5JBWv5
        workspace_id:
          type: string
          pattern: ^ws_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `ws_<base58>`."
          example: ws_3wVELpcuMmQzwJYr5JBWv5
        related_object:
          $ref: "#/components/schemas/PlatformEventRelatedObjectOutput"
        reason:
          type: string
          enum:
            - api_request
            - webhook_replay
            - system_job
      required:
        - id
        - object
        - type
        - created
        - organization_id
        - workspace_id
        - related_object
        - reason
      additionalProperties: false
      description: The Stripe v2 thin envelope delivered to customer webhook endpoints via Svix. Stable
        wire shape — no `data`, no `previous_attributes`, no `api_version`. Consumers fetch the
        current resource state via `related_object.url`. The full snapshot + outcome history is
        available out-of-band on the event-management API (`Event` schema above).
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Platform bearer auth. Accepts a WorkOS user JWT, an `sk_user_*` user API token, an
        `sk_agent_*` agent token, or a platform API key (`ak_live_*` or `ak_test_*`). The principal
        flavor is discriminated server-side by the token prefix; SDK consumers pass through whatever
        credential the operator gave them.
