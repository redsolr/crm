          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        title:
          anyOf:
            - type: string
            - type: "null"
        snippet:
          anyOf:
            - type: string
            - type: "null"
        score:
          type: number
        matched_by:
          type: array
          items:
            type: string
          description: Which retrieval methods produced this hit (e.g. `["fts", "vector"]`). Order is
            unspecified.
        fts_rank:
          anyOf:
            - type: number
            - type: "null"
        vector_score:
          anyOf:
            - type: number
            - type: "null"
        graph_depth:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        community_rank:
          anyOf:
            - type: number
            - type: "null"
        community_title:
          anyOf:
            - type: string
            - type: "null"
        updated_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties: {}
            - type: "null"
      required:
        - source_type
        - source_id
        - title
        - snippet
        - score
        - matched_by
        - fts_rank
        - vector_score
        - graph_depth
        - community_rank
        - community_title
        - updated_at
        - metadata
      additionalProperties: false
      description: A single hybrid-search hit. Heterogeneous — branch on `source_type` to interpret.
