# CRM CI — mirrors the local Definition of Done (CLAUDE.md):
#
#   gates        tsc + jest + next build (fast fail, no services)
#   mocked-e2e   Playwright mocked + mobile projects (no backend)
#   real-auth    the tier that catches what mocks can't: REAL WorkOS
#                login + real Postgres + the /mcp door + the realtime
#                worker (wrangler dev, local mode — no Cloudflare
#                account involved) driving the multiplayer spec
#   deploy       production deploy to Vercel — main pushes only, only
#                when every tier above is green (see job comment)
#
# real-auth is gated on the `RUN_REAL_AUTH_E2E` repo variable so the
# workflow lands green before the secrets exist. To enable:
#   1. Add repo secrets (values = the same keys in .env.local):
#      WORKOS_API_KEY, WORKOS_CLIENT_ID, WORKOS_COOKIE_PASSWORD,
#      E2E_WORKOS_EMAIL, E2E_WORKOS_PASSWORD,
#      E2E_WORKOS_TEAMMATE_EMAIL, E2E_WORKOS_TEAMMATE_PASSWORD,
#      CRM_MCP_TOKEN
#   2. Set repo variable RUN_REAL_AUTH_E2E=true
name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gates:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate OpenAPI client + fail on drift (client is committed for Vercel builds)
        run: |
          npm run openapi:gen
          git diff --exit-code src/lib/generated
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Worker typecheck
        working-directory: realtime
        run: npm ci && npx tsc --noEmit

  mocked-e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate OpenAPI client (gitignored, needed by tsc/build)
        run: npm run openapi:gen
      - name: Placeholder env (authkit proxy wants WorkOS vars at boot, even mocked)
        # NEXT_PUBLIC_API_BASE_URL MUST be :3100 — the mock layer
        # (e2e/handlers/shared.ts) hardcodes API_BASE=localhost:3100 and
        # page.route intercepts by URL, exactly like local .env.local.
        # No server listens there; nothing is meant to reach the network.
        run: |
          cat > .env.local <<EOF
          WORKOS_API_KEY=sk_test_ci_placeholder
          WORKOS_CLIENT_ID=client_ci_placeholder
          WORKOS_COOKIE_PASSWORD=ci_cookie_password_must_be_32_chars_x
          WORKOS_COOKIE_NAME=crm-wos-session
          NEXT_PUBLIC_WORKOS_REDIRECT_URI=http://localhost:3100/callback
          NEXT_PUBLIC_API_BASE_URL=http://localhost:3100
          NEXT_PUBLIC_APP_URL=http://localhost:3100
          EOF
      - run: npx playwright install --with-deps chromium
      - name: Mocked tier
        run: npx cross-env MOCK_AUTH=true playwright test --project=mocked
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-mocked
          path: playwright-report/
          retention-days: 14

  real-auth:
    if: ${{ vars.RUN_REAL_AUTH_E2E == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5440:5432
        options: >-
          --health-cmd="pg_isready -U crm"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate OpenAPI client (gitignored, needed by tsc/build)
        run: npm run openapi:gen

      - name: Materialize .env.local (real WorkOS + e2e seats)
        # Next's dev server reads .env.local; envLocal() in the specs
        # prefers process env but the WorkOS APP credentials must reach
        # the server through the file, exactly like local runs.
        # localhost redirect URIs are allowed wildcard-port in the
        # WorkOS Staging environment, so the e2e port (3190) needs no
        # dashboard entry.
        run: |
          cat > .env.local <<EOF
          WORKOS_API_KEY=${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID=${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_COOKIE_PASSWORD=${{ secrets.WORKOS_COOKIE_PASSWORD }}
          WORKOS_COOKIE_NAME=crm-wos-session
          NEXT_PUBLIC_WORKOS_REDIRECT_URI=http://localhost:3190/callback
          NEXT_PUBLIC_API_BASE_URL=http://localhost:3190
          NEXT_PUBLIC_APP_URL=http://localhost:3190
          E2E_WORKOS_EMAIL=${{ secrets.E2E_WORKOS_EMAIL }}
          E2E_WORKOS_PASSWORD=${{ secrets.E2E_WORKOS_PASSWORD }}
          E2E_WORKOS_TEAMMATE_EMAIL=${{ secrets.E2E_WORKOS_TEAMMATE_EMAIL }}
          E2E_WORKOS_TEAMMATE_PASSWORD=${{ secrets.E2E_WORKOS_TEAMMATE_PASSWORD }}
          CRM_MCP_TOKEN=${{ secrets.CRM_MCP_TOKEN }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          CRM_ASK_MODEL=gpt-5.4-nano
          EOF

      - name: Migrate + seed
        run: npm run db:migrate && npm run db:seed

      - name: Start realtime worker (wrangler dev, local mode)
        working-directory: realtime
        run: |
          npm ci
          echo "REALTIME_SECRET=ci-realtime-secret" > .dev.vars
          npx wrangler dev --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:8788/ > /dev/null 2>&1; then
              echo "realtime worker ready (try $i)"; exit 0
            fi
            sleep 2
          done
          echo "realtime worker failed to start" >&2
          tail -50 /tmp/wrangler.log >&2
          exit 1

      - run: npx playwright install --with-deps chromium

      - name: Real-auth tier (incl. realtime multiplayer + real-LLM specs)
        # RUN_REAL_LLM_E2E turns on the paid-model spec — pennies per
        # run at gpt-5.4-nano (set in .env.local above).
        run: npx cross-env E2E_MODE=real-auth REALTIME_URL=http://localhost:8788 REALTIME_SECRET=ci-realtime-secret RUN_REAL_LLM_E2E=true playwright test --project=real-auth
        env:
          CRM_MCP_TOKEN: ${{ secrets.CRM_MCP_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-real-auth
          path: playwright-report/
          retention-days: 14
      - name: Worker log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log
          path: /tmp/wrangler.log
          retention-days: 7

  deploy:
    # Production deploy — pushes to main only, and only after every
    # test tier is green (a var-disabled real-auth counts as pass; a
    # failed one blocks the deploy). Vercel's push-triggered
    # auto-deploys are OFF (vercel.json git.deploymentEnabled: false)
    # so this job is the ONLY deployer: it asks Vercel's API to build
    # this exact commit from the project's GitHub link. The build +
    # Neon migration (scripts/migrate-deploy.mjs) run on Vercel's
    # infra, where the sensitive-scoped DATABASE_URL lives — it never
    # reaches GitHub.
    #
    # Plain API calls, no Vercel CLI: VERCEL_TOKEN is a team-scoped
    # token (vcp_*) with no user identity, which the CLI cannot use
    # (it always resolves a user first) but the REST API accepts.
    #
    # Gated on `RUN_VERCEL_DEPLOY` so the workflow stays green before
    # the secret exists. To enable:
    #   1. Add repo secret VERCEL_TOKEN (Vercel dashboard → Account
    #      Settings → Tokens, scoped to the team)
    #   2. Set repo variable RUN_VERCEL_DEPLOY=true
    # The IDs below are link config, not credentials (team + project
    # from .vercel/project.json, repoId from the project's git link).
    needs: [gates, mocked-e2e, real-auth]
    if: >-
      ${{ !cancelled() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.RUN_VERCEL_DEPLOY == 'true' &&
          needs.gates.result == 'success' &&
          needs['mocked-e2e'].result == 'success' &&
          (needs['real-auth'].result == 'success' || needs['real-auth'].result == 'skipped') }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      VERCEL_TEAM_ID: team_txhXzjQ4P5MWPOyivnlDIPIY
      VERCEL_PROJECT_ID: prj_8yUb9DHGWeS8hCxde0f4ocrQFCXj
      VERCEL_REPO_ID: "1299076978"
    steps:
      - name: Create production deployment for this commit
        run: |
          resp=$(curl -sf -X POST "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"crm","project":"'"$VERCEL_PROJECT_ID"'","target":"production","gitSource":{"type":"github","repoId":'"$VERCEL_REPO_ID"',"ref":"${{ github.sha }}"}}')
          id=$(echo "$resp" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            echo "deployment creation failed:" >&2
            echo "$resp" | jq . >&2
            exit 1
          fi
          echo "created $id -> https://$(echo "$resp" | jq -r .url)"
          echo "DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"

      - name: Wait for deployment to go READY
        run: |
          for i in $(seq 1 60); do
            state=$(curl -sf -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID" | jq -r .readyState)
            echo "[$i] $state"
            case "$state" in
              READY) exit 0 ;;
              ERROR|CANCELED) echo "deployment ended $state" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "timed out waiting for deployment" >&2
          exit 1
