          name: endpoint_id
          schema:
            type: string
            pattern: ^whep_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `whep_<base58>`."
            example: whep_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `whep_<base58>`."
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
