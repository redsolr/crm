      description: Returns a one-hour magic link into Svix's hosted app portal scoped to the caller's
        account. Complements the native `/v1/webhooks/endpoints/*` CRUD surface with richer UX for
        delivery history, signing-secret rotation, retry controls, and alert routing.
      responses:
        "200":
          description: Portal session.
          content:
