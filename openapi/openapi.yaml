  /v1/events:
    get:
      tags:
        - Events
      summary: List events for the caller's organization
      description: 'Cursor-paginated list of events ordered by `occurred_at` desc. Filters: `type`
        (substring prefix-match), `created_at_gte` / `created_at_lte` (RFC 3339). Each row is an
        event-management record (NOT the delivered Stripe v2 thin envelope) — the stored snapshot is
        included so the developer dashboard can render "what fired" without an extra fetch per row.'
      parameters:
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: page_token
          schema:
            type: string
            minLength: 1
        - in: query
          name: type
          schema:
            description: "Substring prefix-match on `type`. Example: `work_item.` matches every `work_item.*`
              event."
            type: string
            minLength: 1
            maxLength: 100
          description: "Substring prefix-match on `type`. Example: `work_item.` matches every `work_item.*`
            event."
        - in: query
          name: created_at_gte
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        - in: query
          name: created_at_lte
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
  /v1/events/{event_id}:
    get:
      tags:
        - Events
      summary: Retrieve an event envelope + outcomes
      parameters:
        - in: path
          name: event_id
          schema:
            type: string
            description: Stable `id` field from the Stripe v2 thin envelope delivered to your webhook endpoint.
          required: true
          description: Stable `id` field from the Stripe v2 thin envelope delivered to your webhook endpoint.
      responses:
        "200":
          description: The event envelope, with any submitted outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "404":
          description: Event not found in organization.
  /v1/events/{event_id}:redeliver:
    post:
      tags:
        - Events
      summary: Replay an event (AIP-136 custom action)
      description: Inserts a fresh outbox row that re-emits the same Stripe v2 thin envelope (same `id`,
        `type`, `created`, `related_object`) so consumers dedupe naturally. The stored snapshot
        fields (`api_version`, `data`, `previous_attributes`) travel on the management record but
        are never sent to subscribers. Cron picks it up on the next tick. See
        docs/platform/api-discipline.md § F1.
      parameters:
        - in: path
          name: event_id
          schema:
            type: string
            description: Stable `id` field from the Stripe v2 thin envelope delivered to your webhook endpoint.
          required: true
          description: Stable `id` field from the Stripe v2 thin envelope delivered to your webhook endpoint.
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      responses:
        "202":
          description: Redelivery accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "404":
          description: Event not found in organization.
  /v1/events/{event_id}/outcome:
    post:
      tags:
        - Events
      summary: Submit a closed-loop outcome for an event
      description: Idempotent re-POST is allowed and creates a new row — the receiver may want to record
        several outcome stages (`started`, `succeeded`). Customers needing at-most-once should send
        their own `Idempotency-Key` header.
      parameters:
        - in: path
          name: event_id
          schema:
