      description: POST returns BOTH the forward edge and the auto-materialized inverse so callers can
        update local graph state in one round-trip.
    RelationEnvelope:
      type: object
      properties:
        relation:
          $ref: "#/components/schemas/Relation"
      required:
        - relation
      additionalProperties: false
    HybridSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        query:
          type: string
        total_results:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        search_methods:
          type: array
          items:
            type: string
        rerank:
          anyOf:
