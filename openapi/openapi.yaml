  /v1/work_items/{id}/relations:
    get:
      tags:
        - Relations
      summary: List relations for a single work item
      description: Returns the 1-hop neighborhood. `direction=both` (default) returns a single flat list
        with each row carrying its own source / target, so callers can render either direction
        without a second request. `outbound` returns only edges originating from the work item;
        `inbound` only edges pointing at it.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
            example: wi_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
            stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md` §
            A1."
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - outbound
              - inbound
              - both
      responses:
        "200":
          description: Edges incident to the work item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationListEnvelope"
