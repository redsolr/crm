          description: Webhook delivery is not configured in this environment.
  /v1/webhooks/endpoints:
    post:
      tags:
        - Webhooks
      summary: Create a webhook endpoint
      description: Registers a new webhook endpoint subscribed to the events this env emits. The returned
        `id` is our prefixed `whep_*` value — use it for subsequent get / update / delete
        operations.
      parameters:
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpoint"
      responses:
        "201":
          description: Endpoint created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "503":
          description: Webhook delivery is not configured in this environment.
    get:
      tags:
        - Webhooks
      summary: List webhook endpoints for the caller env
      description: Cursor-paginated list of endpoints. The `next_page_url` field wraps the underlying
        delivery-provider iterator in an HMAC-signed opaque token. `previous_page_url` is always
        `null` on this endpoint — the upstream API doesn't expose a backward cursor.
      parameters:
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: page_token
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: A page of endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointPage"
        "503":
          description: Webhook delivery is not configured in this environment.
  /v1/webhooks/endpoints/{endpoint_id}:
