            - type: "null"
        rotated_from_id:
          anyOf:
            - type: string
            - type: "null"
          description: Previous-key id when this row was minted via `:rotate`; null on a freshly issued key.
        rotated_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
        first_used_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
        last_used_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
        last_used_ip:
          anyOf:
            - type: string
            - type: "null"
        revoked_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        token:
          description: The raw `ak_live_*` / `ak_test_*` token. Populated ONLY on the issuance response (`POST
            /v1/api_keys`) and the rotation response (`POST /v1/api_keys/{id}:rotate`). After this
            single echo, the platform cannot recover it — issue a new key if lost.
          type: string
      required:
        - id
        - organization_id
        - workspace_id
        - created_by_id
        - name
        - token_prefix
        - token_last4
        - pinned_version
        - expires_at
        - rotated_from_id
        - rotated_at
        - first_used_at
        - last_used_at
        - last_used_ip
        - revoked_at
        - metadata
        - created_at
      additionalProperties: false
      description: Management projection of a platform API-key row. Hashed token is excluded — it never
        leaves the DB layer. `token` is set on issuance + rotation only; lists, gets, and revokes
        never carry it.
    ApiKeyUsage:
      type: object
      properties:
        api_key_id:
          type: string
          pattern: ^ak_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `ak_<base58>`."
          example: ak_3wVELpcuMmQzwJYr5JBWv5
        organization_id:
          type: string
          pattern: ^org_[1-9A-HJ-NP-Za-km-z]+$
          description: "Prefixed resource ID. Wire form: `org_<base58>`."
          example: org_3wVELpcuMmQzwJYr5JBWv5
        period_start:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        period_end:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        totals:
          $ref: "#/components/schemas/ApiKeyUsageTotals"
        by_day:
