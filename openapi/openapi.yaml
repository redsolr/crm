  /v1/api_keys/{id}:rotate:
    post:
      tags:
        - ApiKeys
      summary: Rotate an API key (AIP-136 custom action)
      description: "Mints a new key with the same scope + metadata + mode + pinned version. The previous
        key is revoked (or sunset, with a grace window) atomically; its id remains on the new row as
        `rotated_from_id`. Returns the new raw token under `token`. Without `grace_period_hours`:
        previous key dies immediately. With it: previous key stays valid for the window (capped at
        the original key's `expires_at`), and the response carries `Sunset` (RFC 8594) +
        `Deprecation` (RFC 9745) headers so SDK consumers can migrate during the window."
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
            example: wi_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
            stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md` §
            A1."
        - in: header
          name: idempotency-key
          schema:
            description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
              docs/platform/stripe-v2-adoption.md.
            type: string
            maxLength: 255
          description: Stripe v2-style key. 30-day replay window; side-effect-safe retry on error. See
            docs/platform/stripe-v2-adoption.md.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateApiKey"
      responses:
        "201":
          description: Rotated. `token` is populated for this single response only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
