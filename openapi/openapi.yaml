        - estimated_cost
        - remaining_cents
        - usage_percentage
        - fallback_used
      additionalProperties: false
      description: Result of pre-flighting an LLM-billed action against the caller's budget.
        `allowed=false` means the request would be rejected by the LLM token enforcer with HTTP 429.
