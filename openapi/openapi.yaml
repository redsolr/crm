    get:
      tags:
        - Organizations
      summary: Per-env / per-model / per-day / per-api-key spend breakdown
      description: Stripe / OpenAI / Anthropic-style usage page data. The caller picks ONE `group_by` per
        request and renders the matching shape directly. `from` / `to` default to the current
        billing period.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
            example: wi_3wVELpcuMmQzwJYr5JBWv5
          required: true
          description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
            stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md` §
            A1."
        - in: query
          name: group_by
          schema:
            type: string
            enum:
              - workspace
              - model
              - day
              - api_key
              - member
              - operation_type
          required: true
        - in: query
          name: from
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        - in: query
          name: to
          schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      responses:
        "200":
          description: Breakdown for the requested grouping + period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageBreakdown"
