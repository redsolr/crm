          $ref: "#/components/schemas/SearchTiming"
      required:
        - results
        - query
        - total_results
        - search_methods
        - rerank
        - timing
      additionalProperties: false
      description: Hybrid-retrieval response — fused FTS + vector + graph + community ranking.
        `total_results` is the count returned, not a global cardinality estimate (search is top-k,
        not paginated).
    SearchHit:
      type: object
      properties:
        source_type:
          type: string
          description: The kind of entity this row points at (e.g. `work_item`, `page`, `comment`, `folder`,
            `kg_community`). Open-ended string — new indexable types ship without a wire-shape
            change. Callers branch on this to interpret `metadata`.
