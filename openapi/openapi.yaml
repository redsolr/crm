  /v1/chats/{id}/responses:
    post:
      tags:
        - Chats
      summary: Invoke the model on a persisted chat
      description: "The model-invocation half of the persisted-chat split. Pair with `POST
        /v1/chats/{id}/messages` (durable append, no model call) per chat-surface-design.md § 2. Set
        `stream: true` for Server-Sent Events; otherwise returns the completed `ChatResponse` JSON.
        Bills via reserve/commit/release (§ 8). Idempotent on the write side via `Idempotency-Key`
        (§ 9): same key + same body returns the existing response_id; same key + different body
        returns 409."
      parameters:
        - in: path
          name: id
          schema:
            type: string
            pattern: ^[a-z][a-z0-9]*_[1-9A-HJ-NP-Za-km-z]+$
            description: "Prefixed resource ID. Wire form: `<prefix>_<base58>`. Prefix is the resource type's
              stable short tag (`acc`, `org`, `pr`, `wi`, …). See `docs/platform/api-discipline.md`
              § A1."
