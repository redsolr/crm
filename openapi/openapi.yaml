        endpoint URLs and the supported scopes / grant types.
      responses:
        "200":
          description: Authorization Server Metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthAuthorizationServerMetadata"
  /.well-known/oauth-protected-resource:
    get:
      tags:
        - OAuth
      summary: Protected Resource Metadata (RFC 9728)
      responses:
        "200":
          description: Protected Resource Metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthProtectedResourceMetadata"
  /oauth/register:
    post:
      tags:
        - OAuth
      summary: Dynamic Client Registration (RFC 7591)
      description: Open registration — any client can self-onboard. Strict redirect_uri validation +
        consent-at-authorize-time keep the attack surface narrow. `client_secret` is returned
        exactly once; we only keep the HMAC hash thereafter.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthClientRegistrationRequest"
      responses:
        "201":
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthClientRegistrationResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthErrorResponse"
  /oauth/par:
    post:
      tags:
        - OAuth
      summary: Pushed Authorization Request (RFC 9126)
      description: Client authenticates and pushes the authorize-time params before the redirect; the
        browser only carries an opaque `request_uri` thereafter. Required for confidential clients.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OauthParRequest"
      responses:
        "201":
          description: Request URI minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthParResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthErrorResponse"
  /oauth/authorize:
    get:
      tags:
        - OAuth
      summary: Authorize endpoint (OAuth 2.1 §4)
      description: Entry point. Unauthenticated by spec — auth state is determined on the consent page
        (WorkOS session cookie). Either redirects to the consent UI on success, redirects back to
        the client with an `error=` param on most failures, or returns a JSON 400 when client_id /
        redirect_uri are untrusted (cannot safely redirect).
      parameters:
        - in: query
          name: response_type
          schema:
            type: string
        - in: query
          name: client_id
          schema:
            type: string
        - in: query
          name: redirect_uri
          schema:
            type: string
        - in: query
          name: scope
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: code_challenge
          schema:
            type: string
        - in: query
          name: code_challenge_method
          schema:
            type: string
        - in: query
          name: resource
          schema:
            type: string
        - in: query
          name: dpop_jkt
          schema:
            type: string
        - in: query
          name: request_uri
          schema:
            type: string
      responses:
        "302":
          description: Redirect to consent UI or client callback.
        "400":
          description: Invalid request (untrusted client_id / redirect_uri).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthErrorResponse"
  /oauth/authorize/pending/{id}:
    get:
      tags:
        - OAuth
      summary: Get pending consent details
      description: Authenticated. Consent UI fetches this to render client name + scope list.
        Authenticated because we don't want to leak "pending consent X exists for client Y" to
        unauthenticated callers.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Pending consent details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthConsentPendingResponse"
        "404":
          description: Pending consent not found / expired / used.
  /oauth/authorize/complete:
    post:
      tags:
        - OAuth
      summary: Approve a pending authorize request
      description: Authenticated. The consent UI POSTs here when the user clicks Approve; the response
        carries the fully-built client redirect URL with the auth code attached.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthConsentDecision"
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthConsentRedirectResponse"
  /oauth/authorize/deny:
    post:
      tags:
        - OAuth
      summary: Deny a pending authorize request
      description: Authenticated. Same shape as `/complete` but the redirect carries `error=access_denied`
        instead of `code=...`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthConsentDecision"
      responses:
        "200":
          description: Denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthConsentRedirectResponse"
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: Token endpoint (RFC 6749 §3.2)
      description: Exchange an authorization code for an access + refresh token pair
        (`grant_type=authorization_code`), or rotate an existing pair (`grant_type=refresh_token`).
        Both grants share this entry point. DPoP-bound clients MUST present a matching `DPoP` header
        proof.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OauthTokenRequest"
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthTokenResponse"
        "400":
          description: Invalid grant / PKCE / scope / DPoP. RFC 6749 §5.2 envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthErrorResponse"
        "401":
          description: Invalid client credentials (or client revoked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthErrorResponse"
  /oauth/revoke:
    post:
      tags:
        - OAuth
      summary: Token Revocation (RFC 7009)
      description: Spec mandates a bare 200 with empty body on success regardless of whether the token
        existed. Already exempt from the DTO ratchet.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  enum:
                    - access_token
                    - refresh_token
                client_id:
                  type: string
                client_secret:
                  type: string
              required:
                - token
      responses:
        "200":
          description: Revoked (or never existed — same shape).
  /v1/webhooks/portal:
