        - group_by
        - period_start
        - period_end
        - data
      additionalProperties: false
      description: Per-workspace / per-model / per-day / per-api-key / per-member / per-operation-type
        spend breakdown for the dashboard. The `data` array shape mirrors the `group_by` request
        param so the chart code branches on a single field.
    UsageByWorkspace:
