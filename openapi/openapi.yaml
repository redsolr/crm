        - display_name
        - provider
        - token_count
        - total_cost_cents
      additionalProperties: false
    UsageByMember:
      type: object
      properties:
        account_id:
          anyOf:
            - type: string
              pattern: ^acc_[1-9A-HJ-NP-Za-km-z]+$
              description: "Prefixed resource ID. Wire form: `acc_<base58>`."
